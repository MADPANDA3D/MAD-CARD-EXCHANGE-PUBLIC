name: Update commit badges

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: MADPANDA3D/mad-card-exchange
          token: ${{ secrets.MAD_CARD_EXCHANGE_PAT }}
          path: private-repo

      - name: Generate badges
        shell: bash
        run: |
          set -euo pipefail
          count=$(git -C private-repo rev-list --count HEAD)
          last_date=$(git -C private-repo log -1 --format=%cs)
          mkdir -p assets/badges
          curl -fsSL "https://img.shields.io/badge/total%20commits-${count}-0ea5e9?style=flat-square" -o assets/badges/commits-total.svg
          curl -fsSL "https://img.shields.io/badge/last%20commit-${last_date}-0f766e?style=flat-square" -o assets/badges/last-commit.svg

      - name: Commit updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No badge changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/badges/commits-total.svg assets/badges/last-commit.svg
          git commit -m "Update commit badges"
          git push
